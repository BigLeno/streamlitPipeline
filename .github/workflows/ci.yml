name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Testes
        run: python -m unittest -v

  screenshot:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt playwright && playwright install --with-deps chromium
      - name: Captura de tela com dados sintéticos
        env:
          MARKET_DATA: fake
          DEFAULT_TICKERS: DEMO3,EXMP4,FICT11,TEST
        run: |
          streamlit run streamlit_app.py --server.port 8501 &
          python scripts/screenshot.py http://localhost:8501 docs/dashboard.png
      - uses: actions/upload-artifact@v5
        with:
          name: screenshot
          path: docs/dashboard.png
      - name: Versionar a captura quando ainda não existe no repositório
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          if git ls-files --error-unmatch docs/dashboard.png >/dev/null 2>&1; then
            echo "Captura já versionada; nada a fazer."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/dashboard.png
          git commit -m "docs: adiciona captura de tela do dashboard"
          git push
