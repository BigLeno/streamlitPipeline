name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Testes
        run: python -m unittest -v

  screenshot:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt playwright && playwright install --with-deps chromium
      - name: Captura de tela com dados sintéticos
        env:
          MARKET_DATA: fake
          DEFAULT_TICKERS: PETR4.SA,VALE3.SA,ITUB4.SA,AAPL
        run: |
          streamlit run streamlit_app.py --server.port 8501 &
          python scripts/screenshot.py http://localhost:8501 docs/dashboard.png
      - uses: actions/upload-artifact@v4
        with:
          name: screenshot
          path: docs/dashboard.png
